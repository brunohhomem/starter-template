name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache do Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Fim de linha
        run: |
          if git ls-files --eol | grep -E 'i/crlf|i/mixed'; then
            echo "O índice tem fim de linha CRLF ou misto."
            exit 1
          fi

      - name: Formatação
        run: pnpm format:check

      - name: Lint, tipos, testes e build
        run: pnpm turbo run lint typecheck test build

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache do Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Iniciar Redis com senha
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7.4 redis-server --requirepass redis
          timeout 30 sh -c 'until docker exec ci-redis redis-cli -a redis ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Gerar .env para testes (exercita keys:generate no CI)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          LOG_LEVEL: info
          SWAGGER_ENABLED: true
          TRUST_PROXY_HOPS: 0
          NODE_ENV: test
        run: pnpm --filter @starter/scripts keys:generate

      - name: Rodar testes de integração
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          LOG_LEVEL: info
          SWAGGER_ENABLED: true
          TRUST_PROXY_HOPS: 0
          NODE_ENV: test
        run: pnpm turbo run test:integration
