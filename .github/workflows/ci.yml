name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache do Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Fim de linha
        run: |
          if git ls-files --eol | grep -E 'i/crlf|i/mixed'; then
            echo "O índice tem fim de linha CRLF ou misto."
            exit 1
          fi

      - name: Formatação
        run: pnpm format:check

      - name: Lint, tipos, testes e build
        run: pnpm turbo run lint typecheck test build

      - name: Iniciar Redis com senha
        run: |
          docker run -d --name ci-redis-boot -p 6379:6379 redis:8.2.6-bookworm redis-server --requirepass redis
          timeout 30 sh -c 'until docker exec ci-redis-boot redis-cli -a redis ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Gerar .env e subir o build de produção
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          WEB_ORIGIN: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
          LOG_LEVEL: info
          SWAGGER_ENABLED: true
          TRUST_PROXY_HOPS: 0
          NODE_ENV: development
          MAIL_DRIVER: smtp
        run: |
          pnpm --filter @starter/scripts keys:generate
          pnpm boot:check

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache do Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Iniciar Redis com senha
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:8.2.6-bookworm redis-server --requirepass redis
          timeout 30 sh -c 'until docker exec ci-redis redis-cli -a redis ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Gerar .env para testes (exercita keys:generate no CI)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
          LOG_LEVEL: info
          SWAGGER_ENABLED: true
          TRUST_PROXY_HOPS: 0
          NODE_ENV: test
        run: pnpm --filter @starter/scripts keys:generate

      - name: Rodar testes de integração
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          TEST_DB_NAME: app_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
          LOG_LEVEL: info
          SWAGGER_ENABLED: true
          TRUST_PROXY_HOPS: 0
          NODE_ENV: test
        run: pnpm turbo run test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mailpit:
        image: axllent/mailpit:v1.15
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache do Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Iniciar Redis com senha
        run: |
          docker run -d --name ci-redis-e2e -p 6379:6379 redis:8.2.6-bookworm redis-server --requirepass redis
          timeout 30 sh -c 'until docker exec ci-redis-e2e redis-cli -a redis ping 2>/dev/null | grep -q PONG; do sleep 1; done'

      - name: Gerar .env
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://localhost:3000
          WEB_ORIGIN: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
          LOG_LEVEL: info
          SWAGGER_ENABLED: false
          TRUST_PROXY_HOPS: 0
          NODE_ENV: development
          MAIL_DRIVER: smtp
          SMTP_HOST: localhost
          SMTP_PORT: 1025
        run: pnpm --filter @starter/scripts keys:generate

      - name: Build de produção
        run: pnpm turbo run build --filter=@starter/api --filter=@starter/web

      - name: Smoke E2E
        env:
          CI: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: app
          DB_PASSWORD: postgres
          DB_NAME: app
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: redis
          API_PORT: 3001
          APP_ORIGIN: http://127.0.0.1:3000
          WEB_ORIGIN: http://127.0.0.1:3000
          API_ORIGIN: http://127.0.0.1:3001
          ADMIN_EMAIL: admin@example.com
          NODE_ENV: development
          MAIL_DRIVER: smtp
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          docker run --rm --network host --ipc=host \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e CI -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASSWORD -e DB_NAME \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            -e API_PORT -e APP_ORIGIN -e WEB_ORIGIN -e API_ORIGIN -e ADMIN_EMAIL \
            -e NODE_ENV -e MAIL_DRIVER -e SMTP_HOST -e SMTP_PORT \
            -e PLAYWRIGHT_BROWSERS_PATH \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            bash -lc 'cd /work/apps/web && ./node_modules/.bin/playwright test'

      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
